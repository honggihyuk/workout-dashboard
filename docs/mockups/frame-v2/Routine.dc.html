<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>루틴 편집</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1F1F}a:hover{color:#000000}
.card{border:1.5px solid #CFCFCF;border-radius:14px;padding:16px;background:#FFFFFF}
.muted{font-size:13px;color:#5E5E5E}
.field{width:100%;box-sizing:border-box;min-height:48px;border:1.5px solid #9A9A9A;border-radius:12px;padding:0 14px;font:inherit;font-size:17px;font-weight:600;background:#FFFFFF;color:#1F1F1F}
.item{display:flex;align-items:center;gap:8px;padding:10px 8px 10px 12px;border:1.5px solid #CFCFCF;border-radius:12px;background:#FFFFFF}
.icon{width:40px;height:40px;flex:none;border:none;border-radius:10px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1F1F1F}
.step{width:36px;height:36px;border:1.5px solid #9A9A9A;border-radius:10px;background:#FFFFFF;font:inherit;font-size:18px;cursor:pointer;color:#1F1F1F}
.btn{min-height:48px;padding:0 16px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:inherit;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer}
.btn-primary{background:#1F1F1F;color:#FFFFFF;border:none}.btn-primary:hover{color:#FFFFFF}
.btn-ghost{background:#FFFFFF;color:#1F1F1F;border:1.5px dashed #9A9A9A}
.chip{min-height:36px;padding:0 12px;border-radius:18px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip-off{border:1.5px solid #9A9A9A;background:#FFFFFF;color:#1F1F1F}
.chip-on{border:1.5px solid #1F1F1F;background:#1F1F1F;color:#FFFFFF}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#5E5E5E;text-decoration:none}
.tab-on{color:#1F1F1F;font-weight:700}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4F4; font-family: 'IBM Plex Sans KR', sans-serif; color: #1F1F1F">
  <div style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Workout.dc.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 15px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>운동
      </a>
      <h1 style="margin: 0; font-size: 18px; font-weight: 700">루틴 편집</h1>
      <span style="width: 52px"></span>
    </div>

    <div style="display: flex; gap: 6px; overflow-x: auto" role="group" aria-label="내 루틴">
      <button type="button" class="chip chip-on" aria-pressed="true">가슴·삼두</button>
      <button type="button" class="chip chip-off" aria-pressed="false">등·이두</button>
      <button type="button" class="chip chip-off" aria-pressed="false">하체·어깨</button>
      <button type="button" class="chip chip-off" aria-pressed="false">+ 새 루틴</button>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span class="muted">루틴 이름</span>
      <input class="field" defaultValue="가슴·삼두">
    </label>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">운동 순서와 세트 수</h2>
      <span class="muted">{{summary}}</span>
    </div>

    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <div class="item">
        <div style="display: flex; flex-direction: column">
          <button type="button" class="icon" style="height: 26px" aria-label="{{it.upLabel}}" onClick="{{it.up}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
          <button type="button" class="icon" style="height: 26px" aria-label="{{it.downLabel}}" onClick="{{it.down}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{it.name}}</span>
          <span class="muted">{{it.meta}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px" role="group" aria-label="{{it.setLabel}}">
          <button type="button" class="step" aria-label="세트 줄이기" onClick="{{it.minus}}">−</button>
          <span style="min-width: 40px; text-align: center; font-size: 15px">{{it.sets}}세트</span>
          <button type="button" class="step" aria-label="세트 늘리기" onClick="{{it.plus}}">+</button>
        </div>
        <button type="button" class="icon" aria-label="{{it.removeLabel}}" onClick="{{it.remove}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </sc-for>

    <a href="ExercisePicker.dc.html" class="btn btn-ghost">+ 운동 추가</a>
    <p class="muted" style="margin: 0">무게와 횟수는 루틴에 적지 않아요. 기록할 때 지난번 값이 자동으로 채워져요. 루틴은 적어 둔 순서대로 돌아가며 "다음 차례"가 정해져요.</p>
    <a href="Workout.dc.html" class="btn btn-primary">저장</a>
  </div>

  <nav aria-label="주요 메뉴" style="display: flex; border-top: 1.5px solid #CFCFCF; background: #FFFFFF; padding-bottom: 16px">
    <a href="Main.dc.html" class="tab"><span style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #9A9A9A; box-sizing: border-box"></span>오늘</a>
    <a href="Workout.dc.html" class="tab tab-on" aria-current="page"><span style="width: 22px; height: 22px; border-radius: 6px; background: #1F1F1F"></span>운동</a>
    <a href="Meals.dc.html" class="tab"><span style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #9A9A9A; box-sizing: border-box"></span>식단</a>
    <a href="Body.dc.html" class="tab"><span style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #9A9A9A; box-sizing: border-box"></span>몸 변화</a>
    <a href="Settings.dc.html" class="tab"><span style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #9A9A9A; box-sizing: border-box"></span>설정</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      list: [
        { name: '벤치프레스', meta: '가슴 · 바벨', sets: 4 },
        { name: '인클라인 덤벨프레스', meta: '가슴 · 덤벨', sets: 3 },
        { name: '케이블 크로스오버', meta: '가슴 · 케이블', sets: 3 },
        { name: '트라이셉스 푸시다운', meta: '팔 · 케이블', sets: 3 }
      ]
    };
  }
  renderVals() {
    const list = this.state.list;
    const set = (next) => this.setState({ list: next });
    const move = (i, d) => {
      const j = i + d;
      if (j < 0 || j >= list.length) return;
      const next = list.slice();
      const t = next[i]; next[i] = next[j]; next[j] = t;
      set(next);
    };
    const patch = (i, sets) => set(list.map((x, k) => (k === i ? Object.assign({}, x, { sets: sets }) : x)));
    const total = list.reduce((a, x) => a + x.sets, 0);
    return {
      summary: list.length + '종목 · ' + total + '세트',
      items: list.map((x, i) => ({
        name: x.name,
        meta: x.meta,
        sets: x.sets,
        up: () => move(i, -1),
        down: () => move(i, 1),
        minus: () => patch(i, Math.max(1, x.sets - 1)),
        plus: () => patch(i, Math.min(10, x.sets + 1)),
        remove: () => set(list.filter((_, k) => k !== i)),
        upLabel: x.name + ' 위로',
        downLabel: x.name + ' 아래로',
        setLabel: x.name + ' 세트 수',
        removeLabel: x.name + ' 빼기'
      }))
    };
  }
}
</script>
</body>
</html>
